name: linux-x86_64

# Linux x86-64 build of Lichii build-130 with Discord Rich Presence compiled in (the official
# releases pass -DUSE_DISCORD_PRESENCE=OFF). An AppImage and a tar.gz, built like
# release-binaries.yml's linux-x86_64-pgo job: clang from apt.llvm.org with the repo's
# eglantine.profdata (profile-guided optimization).
on:
  push:
    branches:
      - lichii130-discord
    tags:
      - "build-130-discord*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Also publish the files as a release with this tag (empty = artifacts only)
        type: string
        default: ""

permissions:
  contents: read

env:
  # A profile written by a newer LLVM cannot be read by an older one; keep this in step with
  # release-binaries.yml.
  PGO_LLVM_VERSION: "23"

# One run per commit; a new push does not cancel the build of an older one.
concurrency:
  group: linux-x86_64-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: linux-x86_64 (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pgo
            suffix: linux-x86_64-pgo
            pgo: true

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The version string reads the commit and its tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      # Ubuntu's clang 18 cannot read a profile from a current LLVM, so clang comes from apt.llvm.org.
      - name: Install clang for PGO
        if: matrix.pgo
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version
          test -s eglantine.profdata

      - name: Restore CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-linux-x86_64-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-linux-x86_64-

      - name: Restore compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.suffix }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.suffix }}-${{ github.sha }}-
            ccache-${{ matrix.suffix }}-

      - name: Configure
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            # The updater looks for upstream build-N releases, which are not this fork's builds.
            -DENABLE_UPDATE_CHECKER=OFF
            -DLICHII_BUILD_TAG=build-130
            -DLICHII_BUILD_PLATFORM=${{ matrix.suffix }}
            -DUSE_DISCORD_PRESENCE=ON
            -DUSE_CCACHE=ON
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Build
        run: |
          ccache --zero-stats
          # -k 0: keep going after a failed file so one run shows every compile error.
          cmake --build build/release --target yuzu yuzu-cmd --parallel -- -k 0
          ccache --show-stats

      - name: Package tar.gz
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          test -x build/release/bin/eden-cli
          # Since build 125 lichii links the .nx archive library, shipped next to it.
          test -f build/release/bin/libnxformat.so
          strip build/release/bin/lichii build/release/bin/eden-cli
          mkdir -p out
          tar -czf "out/Lichii130-Discord-${{ matrix.suffix }}.tar.gz" -C build/release/bin lichii eden-cli libnxformat.so
          ls -la out

      - name: Package AppImage
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="build-130-discord-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="out/Lichii130-Discord-${{ matrix.suffix }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH=x86_64
          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          find AppDir -name 'libnxformat.so*' | grep -q . || { echo "::error::libnxformat.so missing from the AppImage"; exit 1; }
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lichii130-Discord-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          cat > notes.md <<'EOF'
          Lichii build-130 (zortos293, 3dae119) with Discord Rich Presence compiled in. Linux x86-64, built by GitHub Actions.

          - `Lichii130-Discord-linux-x86_64.AppImage`: self-contained (glibc 2.39+: Ubuntu 24.04, Fedora 40, Debian 13, Arch). `chmod +x` and run it.
          - `.tar.gz`: just the two programs; needs Qt 6 and the usual libraries installed on the system.

          No keys, firmware or games are included: use your own.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Lichii build-130 + Discord ($TAG)" --notes-file notes.md
